name: ios-agent

on:
  push:
    paths: ['apple/JikoiOSAgent/**', 'apple/JikoKit/**', '.github/workflows/ios-agent.yml']
  pull_request:
    paths: ['apple/JikoiOSAgent/**', 'apple/JikoKit/**', '.github/workflows/ios-agent.yml']

jobs:
  kit:
    runs-on: macos-15
    defaults:
      run:
        working-directory: apple/JikoKit
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | tail -1)"
      - name: Test JikoKit
        run: swift test

  app:
    runs-on: macos-15
    defaults:
      run:
        working-directory: apple/JikoiOSAgent
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | tail -1)"
      - name: Build
        run: xcodebuild -project JikoiOSAgent.xcodeproj -scheme JikoiOSAgent -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
      - name: Unit tests
        run: xcodebuild -project JikoiOSAgent.xcodeproj -scheme JikoiOSAgent -destination 'platform=iOS Simulator,name=iPhone 16' -only-testing:JikoiOSAgentTests CODE_SIGNING_ALLOWED=NO test
