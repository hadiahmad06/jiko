name: backup

on:
  schedule:
    - cron: '17 7 * * *'   # 07:17 UTC nightly, off the hour so it isn't in a stampede
  workflow_dispatch:

jobs:
  dump:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Install postgresql-client-15
        run: |
          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg
          sudo apt-get update && sudo apt-get install -y postgresql-client-15
      - name: Dump
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL is not set; nothing to back up yet."
            exit 0
          fi
          ./scripts/backup.sh ./backups
      - name: Keep the dump as an artifact
        if: ${{ env.DATABASE_URL != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: jiko-dump
          path: backend/backups/*.dump
          retention-days: 14
